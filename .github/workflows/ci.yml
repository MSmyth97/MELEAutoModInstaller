name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4          # no submodules: nothing builds against external/
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build src/Mele.Tests src/Mele.App.Tests src/Mele.Cli -c Release
      - name: Engine tests
        run: dotnet test src/Mele.Tests -c Release --no-build
      - name: GUI tests (headless; xUnit v3 projects are run directly)
        run: dotnet run --project src/Mele.App.Tests -c Release --no-build

  package:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Package (linux-x64)
        run: build/package.sh linux-x64 dist
      - name: Package (win-x64)
        run: build/package.sh win-x64 dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
