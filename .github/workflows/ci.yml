name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4          # no submodules: nothing builds against external/
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build src/MELEAutoModInstaller.sln -c Release
      - name: Engine tests
        run: dotnet test src/Mele.Tests -c Release --no-build
      - name: GUI tests (headless; xUnit v3 projects are run directly)
        run: dotnet run --project src/Mele.App.Tests -c Release --no-build

  package:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Package (linux-x64)
        run: build/package.sh linux-x64 dist
      - name: Package (win-x64)
        run: build/package.sh win-x64 dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.tar.gz
            dist/*.zip
      # One call makes the draft and attaches both packages. (softprops/action-gh-release uploaded in parallel and left a duplicate
      # release per tag.) The release stays a draft: publish it from the Releases page after reading the notes.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: build/release-draft.sh "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip
