[project]
name = "mele-auto-mod-installer"
version = "0.1.0"
description = "Download and stage the mods in a ME3Tweaks Batch Mod Installer group (.biq2) via the Nexus Mods API"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mele-installer = "mele_installer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mele_installer"]
